# Agent Team Definitions
# ---------------------------------------------
# Simple format:
#   team_name:
#     - agent_name
#
# With model override (takes precedence over .md frontmatter model):
#   team_name:
#     - name: agent_name
#       model: provider/model-name
#
# Top-level keys:
#   memory_model:
#       model: <provider>/<model>  - summarizer model; memory runs only when active: true.
#       active: true|false         - persistent on/off switch (must be true to run; sidebar toggle).
#       A background subprocess summarizes each orchestrator turn and writes
#       per-category files under <cwd>/.pi_memory/.

memory_model:
  model: xiaomi-token-plan-ams/mimo-v2.5
  active: true

subagent_team:
  - name: file_reader
    model: xiaomi-token-plan-ams/mimo-v2.5
  - name: searcher
    model: xiaomi-token-plan-ams/mimo-v2.5
  - name: coder
    active: false
  - name: tester
    model: xiaomi-token-plan-ams/mimo-v2.5
  - name: documenter
    model: xiaomi-token-plan-ams/mimo-v2.5
    active: false
  - name: doc_generator
    model: xiaomi-token-plan-ams/mimo-v2.5
    active: false
  - name: image_analyzer
    model: xiaomi-token-plan-ams/mimo-v2.5
  - name: harsh_critic
    model: xiaomi-token-plan-ams/mimo-v2.5-pro
    active: false

test_subagent_team:
  - name: coder
  - name: documenter
  - name: file_reader
  - name: searcher
  - name: tester
  - name: image_analyzer
  - name: doc_generator

