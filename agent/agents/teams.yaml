# Agent Team Definitions
# ---------------------------------------------
# Simple format:
#   team_name:
#     - agent_name
#
# With model override (takes precedence over .md frontmatter model):
#   team_name:
#     - name: agent_name
#       model: provider/model-name


subagent_team:
  - name: file_reader
    model: opencode/deepseek-v4-flash-free
  - name: searcher
    model: opencode/deepseek-v4-flash-free
  - name: coder
    model: xiaomi/mimo-v2.5-pro 
  - name: tester
    model: opencode/deepseek-v4-flash-free
  - name: documenter
    model: opencode/deepseek-v4-flash-free 

test_subagent_team:
  - name: coder
  - name: documenter
  - name: file_reader
  - name: searcher
  - name: tester
  
