    model: zai/glm-5.1

document_team:
  - name: documenter
    model: opencode/deepseek-v4-flash-free

worker_team:
  - name: scout
    model: opencode/deepseek-v4-flash-free
  - name: planner
    model: xiaomi/mimo-v2.5-pro 
  - name: worker
    model: opencode/mimo-v2.5-free 
  - name: reviewer
    model: opencode/mimo-v2.5-free
