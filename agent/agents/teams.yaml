# Agent Team Definitions
# ---------------------------------------------
# Simple format:
#   team_name:
#     - agent_name
#
# With model override (takes precedence over .md frontmatter model):
#   team_name:
#     - name: agent_name
#       model: provider/model-name

build_team:
  - name: planner
  - name: worker
    model: zai/glm-5.1
  - name: reviewer

fix_team:
  - name: fixer
    model: zai/glm-5.1

document_team:
  - name: documenter

worker_team:
  - name: worker
    model: zai/glm-5.1
