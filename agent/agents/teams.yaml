# Agent Team Definitions
# ---------------------------------------------
# Simple format:
#   team_name:
#     - agent_name
#
# With model override (takes precedence over .md frontmatter model):
#   team_name:
#     - name: agent_name
#       model: provider/model-name
#
# Top-level keys:
#   memory_model:
#       model: <provider>/<model>  - enables the per-turn project memory feature.
#       active: true|false         - persistent on/off switch (sidebar toggle).
#       A background subprocess summarizes each orchestrator turn and appends
#       the result to <cwd>/.pi_memory/project_memory.md.

memory_model:
  model: opencode/mimo-v2.5-free
  active: true

subagent_team:
  - name: file_reader
    model: opencode/deepseek-v4-flash-free
  - name: searcher
    model: opencode/deepseek-v4-flash-free
  - name: coder
  - name: tester
    model: opencode/deepseek-v4-flash-free
  - name: documenter
    model: opencode/deepseek-v4-flash-free
    active: false
  - name: doc_generator
    model: opencode/deepseek-v4-flash-free
    active: false
  - name: image_analyzer
    model: opencode/mimo-v2.5-free
    active: false
  - name: harsh_critic
    model: opencode/deepseek-v4-flash-free

test_subagent_team:
  - name: coder
  - name: documenter
  - name: file_reader
  - name: searcher
  - name: tester
  - name: image_analyzer
  - name: doc_generator

